<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1620"/>
      <stop offset="45%" stop-color="#143044"/>
      <stop offset="78%" stop-color="#2a3a38"/>
      <stop offset="100%" stop-color="#1a2220"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#5eb8b0" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d4a15a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2f6f6c" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e181c" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#haze)"/>
