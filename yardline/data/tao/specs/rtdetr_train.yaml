results_dir: /tao/results/rtdetr
encryption_key: yardline
model:
  backbone: resnet_50
  train_backbone: true
  return_interm_indices: [1, 2, 3]
  dec_layers: 6
  enc_layers: 1
  num_queries: 300
train:
  num_epochs: 30
  checkpoint_interval: 5
  validation_interval: 5
  clip_grad_norm: 0.1
  precision: fp16
  distributed_strategy: ddp
  activation_checkpoint: true
  num_gpus: 1
  gpu_ids: [0]
  num_nodes: 1
  seed: 1234
  optim:
    optimizer: AdamW
    lr: 0.0001
    lr_backbone: 0.00001
    momentum: 0.9
    weight_decay: 0.0001
    lr_scheduler: MultiStep
    lr_steps: [20]
    lr_decay: 0.1
dataset:
  train_data_sources:
    - image_dir: /data/coco/images
      json_file: /data/coco/annotations/instances_train.json
  val_data_sources:
    image_dir: /data/coco/images
    json_file: /data/coco/annotations/instances_val.json
  test_data_sources:
    image_dir: /data/coco/images
    json_file: /data/coco/annotations/instances_val.json
  infer_data_sources:
    image_dir: [/data/coco/images]
    classmap: /data/coco/annotations/classmap.txt
  num_classes: 3
  batch_size: 4
  workers: 4
  remap_mscoco_category: false
  dataset_type: serialized
  pin_memory: true
  augmentation:
    train_spatial_size: [640, 640]
    eval_spatial_size: [640, 640]
    preserve_aspect_ratio: false
